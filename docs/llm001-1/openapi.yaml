      operationId: getPilotSummaryMetrics
      tags:
        - Pilot
      security:
        - cookieAuth: []
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - school
              - global
            default: school
        - name: include_synthetic
          in: query
          schema:
            oneOf:
              - type: boolean
              - type: integer
                enum:
                  - 0
                  - 1
          description: Explicit synthetic inclusion for authorized scope; frontend allows
            only isolated app-test.
      responses:
        "200":
          description: Сводные метрики эффективности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PilotMetricsResponse'
