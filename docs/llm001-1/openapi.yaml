openapi: 3.1.0
info:
  title: Школьные события API
  description: "REST API v1 бэкенда образовательного сервиса «Школьные события»
    (Сбер × УрФУ). Полная реализация серверных возможностей Design v1.0 (BE-008:
    A/B-сравнение сценариев, исследование регионального контекста, пилотное
    исследование 20 педагогов и расчет метрик эффективности)."
  version: 1.7.0
servers:
  - url: http://localhost:8000/api/v1
    description: Локальное Docker-окружение разработки
paths:
  /auth/login:
    post:
      summary: Аутентификация пользователя в браузере (Nuxt 4 SPA)
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  example: teacher@school130.ru
                password:
                  type: string
                  format: password
                  example: SecurePassword2026!
      responses:
        "200":
          description: Успешный вход (сессионная кука laravel_session выставляется в
            Set-Cookie)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/ValidationError'
  /auth/logout:
    post:
      summary: Завершение сессии пользователя
      operationId: logout
      tags:
        - Auth
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Успешный выход
  /auth/me:
    get:
      summary: Профиль текущего пользователя и членство в школах
      operationId: getCurrentUser
      tags:
        - Auth
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Данные пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
  /tenant/current:
    get:
      summary: Получение контекста активной школы пользователя
      operationId: getCurrentTenant
      tags:
        - Tenant
      security:
        - cookieAuth: []
      parameters:
        - name: X-School-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Идентификатор школы для явного переключения
      responses:
        "200":
          description: Активный контекст школы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCurrentEnvelope'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
  /system/status:
    get:
      summary: Проверка статуса системного доступа
      operationId: getSystemStatus
      tags:
        - System
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Статус системной панели
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusEnvelope'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /calendar-events:
    get:
      summary: Получение каталога событий с фильтрацией
      operationId: listCalendarEvents
      tags:
        - Calendar
      security:
        - cookieAuth: []
      parameters:
        - name: region_code
          in: query
          schema:
            type: string
          example: "66"
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: type
          in: query
          schema:
            type: string
            enum:
              - federal
              - regional
              - cultural_traditional
              - school_custom
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: academic_year
          in: query
          schema:
            type: string
            pattern: ^[0-9]{4}-[0-9]{4}$
      responses:
        "200":
          description: Список событий календаря
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventListResponse'
    post:
      summary: Создание события календаря (для куратора или школьного админа)
      operationId: createCalendarEvent
      tags:
        - Calendar
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCalendarEventRequest'
      responses:
        "201":
          description: Событие создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventEnvelope'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
  /calendar-events/{id}:
    get:
      summary: Детальная информация о событии календаря с источниками и evidence
      operationId: getCalendarEvent
      tags:
        - Calendar
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Полные данные события
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventEnvelope'
        "404":
          $ref: '#/components/responses/NotFound'
  /schools/{schoolId}/traditions:
    get:
      summary: Список традиций конкретной школы
      operationId: listSchoolTraditions
      tags:
        - Traditions
      security:
        - cookieAuth: []
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Список школьных традиций
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraditionListResponse'
    post:
      summary: Создание новой школьной традиции
      operationId: createSchoolTradition
      tags:
        - Traditions
      security:
        - cookieAuth: []
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTraditionRequest'
      responses:
        "201":
          description: Традиция успешно создана
        "403":
          $ref: '#/components/responses/Forbidden'
  /traditions/{id}/versions:
    post:
      summary: Создание новой ежегодной версии школьной традиции
      operationId: createTraditionVersion
      tags:
        - Traditions
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTraditionVersionRequest'
      responses:
        "201":
          description: Версия на учебный год создана
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/ValidationError'
  /scenario-requests:
    post:
      summary: Сохранение параметров запроса в конструкторе мероприятий
      operationId: createScenarioRequest
      tags:
        - Constructor
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScenarioRequestDTO'
      responses:
        "201":
          description: Запрос сохранен, контекст зафиксирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRequestEnvelope'
        "422":
          $ref: '#/components/responses/ValidationError'
  /scenario-requests/{id}/generate:
    post:
      summary: Запуск асинхронной генерации сценария с помощью LLM
      operationId: triggerScenarioGeneration
      tags:
        - Generation
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Генерация принята в очередь обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationAcceptedResponse'
        "409":
          description: Конфликт идемпотентности или параллельная обработка
  /generation-runs/{id}:
    get:
      summary: Опрос статуса выполнения задачи генерации
      operationId: getGenerationRunStatus
      tags:
        - Generation
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Статус генерации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRunEnvelope'
  /scenarios:
    get:
      summary: Список сценариев школы текущего пользователя
      operationId: listScenarios
      tags:
        - Scenarios
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - draft
              - completed
              - archived
        - name: is_archived
          in: query
          schema:
            oneOf:
              - type: boolean
              - type: string
                enum:
                  - all
                  - "true"
                  - "false"
                  - "0"
                  - "1"
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: sort
          in: query
          schema:
            type: string
            description: created_at, updated_at or title with :asc/:desc or _asc/_desc
      responses:
        "200":
          description: Список сценариев
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioListResponse'
  /scenarios/{id}:
    get:
      summary: Получение сценария с актуальной ревизией
      operationId: getScenario
      tags:
        - Scenarios
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Полные данные сценария
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioEnvelope'
    delete:
      summary: Безопасное soft-delete удаление сценария (блокируется при наличии
        sign-off)
      operationId: deleteScenario
      tags:
        - Scenarios
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Сценарий успешно удален
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
  /scenarios/{id}/revisions/{version}:
    get:
      summary: Получить детальную информацию о конкретной ревизии сценария
      operationId: getScenarioRevision
      tags:
        - Scenarios
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: path
          required: true
          schema:
            type: integer
          description: Номер ревизии сценария
      responses:
        "200":
          description: Ревизия сценария успешно получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRevisionEnvelope'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Частичное редактирование сценария (создание новой неизменяемой ревизии
        N+1)
      operationId: updateScenarioRevision
      tags:
        - Scenarios
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: path
          required: true
          schema:
            type: integer
          description: Номер текущей ревизии (сверяется с базой)
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: Текущее значение optimistic_lock_version сценария
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScenarioRevisionRequest'
      responses:
        "201":
          description: Новая ревизия создана, отправлена на модерацию
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioMutationEnvelope'
        "409":
          description: Конфликт версий или попытка отредактировать устаревшую ревизию
  /scenarios/{id}/revisions/{version}/verifications:
    get:
      summary: Результаты автоматической проверки ревизии (P0 и P1)
      operationId: getRevisionVerifications
      tags:
        - Moderation
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Находки модерации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRunEnvelope'
  /scenarios/{id}/revisions/{version}/verify:
    post:
      summary: Принудительный перезапуск модерации ревизии
      operationId: retriggerVerification
      tags:
        - Moderation
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Повторная проверка поставлена в очередь
  /scenarios/{id}/revisions/{version}/signoff:
    post:
      summary: Ручное подтверждение сценария педагогом
      operationId: teacherSignoff
      tags:
        - SignOff
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherSignoffRequest'
      responses:
        "200":
          description: Сценарий подтвержден педагогом
        "422":
          description: Блокировка! В ревизии есть неисправленные замечания P0 или не все
            пункты чек-листа подтверждены
  /scenarios/{id}/revisions/{version}/exports:
    get:
      summary: История сформированных экспортов ревизии сценария
      operationId: listRevisionExports
      tags:
        - Export
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Идентификатор сценария
        - name: version
          in: path
          required: true
          schema:
            type: integer
          description: Номер ревизии сценария
      responses:
        "200":
          description: Список сформированных заданий экспорта и артефактов с флагом
            доступности скачивания
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobListEnvelope'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
    post:
      summary: Запуск генерации экспортного документа (PDF, DOCX, PPTX, Print Pack)
      operationId: requestExport
      tags:
        - Export
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: path
          required: true
          schema:
            type: integer
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 64
          description: Уникальный ключ идемпотентности операции экспорта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - format
              additionalProperties: false
              properties:
                format:
                  type: string
                  enum:
                    - pdf
                    - docx
                    - pptx
                    - print_pack_pdf
                allow_historical:
                  type: boolean
                  default: false
                  description: Запрещён в текущей версии (возвращает 409 Conflict)
      responses:
        "202":
          description: Задача экспорта принята
        "403":
          description: Экспорт запрещен при наличии открытых P0-замечаний или отсутствии
            sign-off
  /export-jobs/{id}:
    get:
      summary: Проверка статуса сборки экспортного документа
      operationId: getExportJobStatus
      tags:
        - Export
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Статус сборки и ссылка на скачивание
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobEnvelope'
  /export-jobs/{id}/download:
    get:
      summary: Скачивание скомпилированного файла
      operationId: downloadExportArtifact
      tags:
        - Export
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Бинарный поток файла
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          $ref: '#/components/responses/NotFound'
  /health:
    get:
      summary: Системный healthcheck сервиса и инфраструктурных зависимостей
      operationId: checkHealth
      tags:
        - System
      responses:
        "200":
          description: Сервис и базы данных функционируют штатно
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - timestamp
                  - services
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  services:
                    type: object
                    required:
                      - database
                      - redis
                    properties:
                      database:
                        type: string
                        example: connected
                      redis:
                        type: string
                        example: connected
        "503":
          description: Деградация сервиса (недоступность PostgreSQL или Redis)
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - timestamp
                  - services
                properties:
                  status:
                    type: string
                    example: degraded
                  timestamp:
                    type: string
                    format: date-time
                  services:
                    type: object
                    required:
                      - database
                      - redis
                    properties:
                      database:
                        type: string
                        example: disconnected
                      redis:
                        type: string
                        example: disconnected
  /scenario-requests/{id}:
    get:
      summary: Получение параметров запроса на сценарий и снимка контекста
      operationId: getScenarioRequest
      tags:
        - Constructor
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Запрос сценария найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRequestEnvelope'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /catalog/review-queue:
    get:
      summary: Очередь первоисточников и утверждений для экспертной рецензии
      operationId: getCatalogReviewQueue
      tags:
        - Cultural Catalog
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - approved
              - rejected
              - requires_amendment
              - all
            default: pending
        - name: region_code
          in: query
          required: false
          schema:
            type: string
        - name: event_type
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Список первоисточников в очереди рецензирования
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueueResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /event-sources/{id}:
    get:
      summary: Детальная карточка первоисточника с историей рецензий и привязанными
        утверждениями
      operationId: getEventSource
      tags:
        - Cultural Catalog
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
