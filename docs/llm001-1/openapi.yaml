                $ref: '#/components/schemas/ScenarioComparisonEnvelope'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationError'
        "503":
          description: Safe LLM configuration failure
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
      description: "Mock returns completed synchronously. LiteLLM returns 201 pending:
        poll GET /scenario-comparisons/{id}. Failed comparisons are terminal;
        paid requests are never automatically replayed. Optional UUID
        Idempotency-Key replays within user and school scope; conflicting reuse
        returns 409."
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
