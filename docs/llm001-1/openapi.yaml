        "403":
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Сессионная кука Laravel Sanctum для Nuxt 4 SPA с защитой CSRF
  responses:
    Unauthorized:
      description: Отсутствует или недействительна сессия
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Недостаточно прав или попытка доступа к чужой школе
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Ошибка валидации переданных параметров
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Конфликт состояния ресурса (например, попытка удаления сценария с
        подписанным педагогическим допуском)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Некорректный запрос или ошибка параметров
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
            - trace_id
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                  message:
                    type: string
            trace_id:
              type: string
    LoginResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - user
            - schools
          properties:
            user:
              type: object
              required:
                - id
                - name
                - email
                - system_role
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                email:
                  type: string
                system_role:
                  type: string
                  enum:
                    - none
                    - catalog_curator
                    - system_admin
            schools:
              type: array
              items:
                type: object
                required:
                  - school_id
                  - name
                  - role
                  - is_default
                properties:
                  school_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  role:
                    type: string
                    enum:
                      - teacher
                      - school_admin
                  is_default:
                    type: boolean
    UserEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - user
            - schools
          properties:
            user:
              type: object
              required:
                - id
                - name
                - email
                - system_role
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                email:
                  type: string
                system_role:
                  type: string
                  enum:
                    - none
                    - catalog_curator
                    - system_admin
            schools:
              type: array
              items:
                type: object
                required:
                  - school_id
                  - name
                  - role
                  - is_default
                properties:
                  school_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  role:
                    type: string
                    enum:
                      - teacher
                      - school_admin
                  is_default:
                    type: boolean
    CreateCalendarEventRequest:
      type: object
      required:
        - title
        - event_type
        - date_type
        - description
        - target_age_groups
        - recommended_value_directions
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 3
        event_type:
          type: string
          enum:
            - federal
            - regional
            - cultural_traditional
            - school_custom
        region_code:
          type:
            - string
            - "null"
        date_type:
          type: string
          enum:
            - fixed_annual
            - floating_rule
            - single_occurrence
        fixed_month:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 12
        fixed_day:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 31
        description:
          type: string
          minLength: 10
        target_age_groups:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - primary_1_4
              - basic_5_9
              - senior_10_11
        recommended_value_directions:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - family
              - mutual_aid
              - historical_memory
              - labor_and_creation
              - cultural_diversity
              - civic_responsibility
